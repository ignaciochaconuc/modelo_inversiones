[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-system"
version = "0.1.0"
description = "Point-in-time multi-agent investment research foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "exchange-calendars>=4.5", "httpx>=0.27", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "pydantic>=2.6", "python-dotenv>=1.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
